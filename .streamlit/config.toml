# Sentinel AI financial dashboard theme

[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#07060B"
secondaryBackgroundColor = "#171022"
codeBackgroundColor = "#171022"
textColor = "#F5F3FF"
linkColor = "#B794F6"
borderColor = "#332544"
codeTextColor = "#D8D1E3"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "23px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#818CF8"
violetColor = "#8B5CF6"
grayColor = "#A9A2B8"

chartCategoricalColors = [
    "#8B5CF6",
    "#34D399",
    "#B794F6",
    "#F87171",
    "#FBBF24",
    "#818CF8",
    "#A9A2B8",
    "#FB923C",
]

chartSequentialColors = [
    "#160D24",
    "#211132",
    "#30154A",
    "#431C68",
    "#5B278C",
    "#7439AC",
    "#8B5CF6",
    "#A78BFA",
    "#C4B5FD",
    "#EDE9FE",
]

dataframeBorderColor = "#332544"
dataframeHeaderBackgroundColor = "#171022"

[theme.sidebar]
backgroundColor = "#0D0914"
secondaryBackgroundColor = "#171022"
codeBackgroundColor = "#171022"
textColor = "#F5F3FF"
borderColor = "#2D203C"
primaryColor = "#8B5CF6"

[server]
headless = true
